<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nextstep — スマホ版プレビュー</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#e9e9e4;display:flex;flex-direction:column;align-items:center;gap:18px;padding:32px 16px;font-family:'Manrope','Zen Kaku Gothic New',sans-serif}
  h1{margin:0;font-size:15px;letter-spacing:0.06em;color:#55554E;font-weight:800}
  p.note{margin:0;font-size:12px;color:#8B8B80}
  .device{width:390px;max-width:100%;height:844px;background:#111;border-radius:52px;padding:12px;box-shadow:0 26px 70px rgba(0,0,0,.32),0 0 0 2px #2b2b2b}
  .screen{position:relative;width:100%;height:100%;background:#fff;border-radius:42px;overflow:hidden}
  .notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#111;border-radius:16px;z-index:5}
  iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
  <h1>Nextstep 公式サイト — iPhone (390 × 844)</h1>
  <p class="note">実機と同じ幅でスクロールできます。ヘッダーは透明・固定表示です。</p>
  <div class="device">
    <div class="screen">
      <div class="notch"></div>
      <iframe src="Nextstep Top v3.dc.html" title="Nextstep mobile"></iframe>
    </div>
  </div>
</body>
</html>
